name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "**.md"]
  pull_request:
    paths-ignore: ["backend/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a GitHub Release on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The AI Studio export has no gradlew / wrapper jar, so install the
      # exact Gradle version from gradle-wrapper.properties (9.3.1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # build.gradle.kts expects debug.keystore in the project root (it is gitignored).
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Release keystore: ALWAYS the same key, so new APKs install as an update
      # over the old app (keeps your data). Uses repo secrets if set, otherwise
      # a permanent key embedded below (no extra file needed).
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "STORE_PASSWORD=wBe9iAuRodwUticFTkzc" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=wBe9iAuRodwUticFTkzc" >> "$GITHUB_ENV"
            echo "" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # Google Sign-In: add these 2 repo secrets (Settings -> Secrets -> Actions).
      #   GOOGLE_SERVICES_JSON    = full contents of google-services.json (package com.example)
      #   GOOGLE_WEB_CLIENT_ID    = Web client ID from Firebase -> Auth -> Google provider
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set - Google Sign-In will be disabled."
          fi
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" > .env
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show real error
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Execution failed" -A6 build.log | head -80

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/CastFlix.apk

      # Always keep ONE release called "latest" so this link never changes:
      # https://github.com/<user>/<repo>/releases/latest/download/CastFlix.apk
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/CastFlix.apk \
            --title "CastFlix (build ${{ github.run_number }})" \
            --notes "Automatic build #${{ github.run_number }} from commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --latest

      # Tells the backend about the new build, so every older app shows the
      # "Update available" popup on launch. Needs repo secret ADMIN_PASSWORD
      # (same as the backend admin password). Optional secret BACKEND_URL.
      - name: Publish update to app popup
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_PASSWORD secret not set - skipping update popup publish."
            exit 0
          fi
          # Old app versions talk to Koyeb, new ones to bot-hosting. Publish the update popup to both.
          APK="https://github.com/${{ github.repository }}/releases/latest/download/CastFlix.apk"
          for BASE in "https://gastric-rasla-evamusic-01582837.koyeb.app" "${BACKEND_URL:-https://castflix201.apps.bot-hosting.cloud}"; do
            echo "Publishing update to $BASE"
            TOKEN=$(curl -sS -X POST "$BASE/api/auth/login" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "$ADMIN_PASSWORD" '{password:$p}')" | jq -r .token)
            curl -sS -X POST "$BASE/api/update" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg vc "${{ github.run_number }}" --arg url "$APK" \
                    '{versionCode:$vc, versionName:("1.1."+$vc), apkUrl:$url, changelog:"A new version of CastFlix is ready. Update now for the latest features and fixes.", force:false}')" || true
          done

      # Optional: GitHub artifact storage can be full, so never fail the build on this.
      - name: Upload artifact (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CastFlix-apk
          path: dist/CastFlix.apk
          retention-days: 1
          if-no-files-found: error


          
