name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "**.md"]
  pull_request:
    paths-ignore: ["backend/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a GitHub Release on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The AI Studio export has no gradlew / wrapper jar, so install the
      # exact Gradle version from gradle-wrapper.properties (9.3.1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # build.gradle.kts expects debug.keystore in the project root (it is gitignored).
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Release keystore: use repo secrets if set, otherwise generate a throwaway
      # one so the release APK is still installable (but NOT upgradable across builds).
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - using a temporary keystore."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" \
              -storepass android123 -keypass android123 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=URL Stream,O=URL Stream,C=US"
            echo "STORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/CastFlix.apk

      # Always keep ONE release called "latest" so this link never changes:
      # https://github.com/<user>/<repo>/releases/latest/download/CastFlix.apk
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/CastFlix.apk \
            --title "CastFlix (build ${{ github.run_number }})" \
            --notes "Automatic build #${{ github.run_number }} from commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --latest

      # Optional: GitHub artifact storage can be full, so never fail the build on this.
      - name: Upload artifact (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CastFlix-apk
          path: dist/CastFlix.apk
          retention-days: 1
          if-no-files-found: error
          
