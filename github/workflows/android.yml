name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "**.md"]
    tags: ["v*"]
  pull_request:
    paths-ignore: ["backend/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a GitHub Release on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The AI Studio export has no gradlew / wrapper jar, so install the
      # exact Gradle version from gradle-wrapper.properties (9.3.1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # build.gradle.kts expects debug.keystore in the project root (it is gitignored).
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Release keystore: use repo secrets if set, otherwise generate a throwaway
      # one so the release APK is still installable (but NOT upgradable across builds).
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - using a temporary keystore."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" \
              -storepass android123 -keypass android123 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=URL Stream,O=URL Stream,C=US"
            echo "STORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk   dist/URLStream-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/URLStream-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: URLStream-apk
          path: dist/*.apk
          if-no-files-found: error

      # Tag push (v1.0) -> release named after the tag.
      - name: Publish GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      # Push to main or manual run -> a "Build #N" release with the APK download link.
      - name: Publish build release (main)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: URL Stream build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.apk
          
